[workspace]
members = ["core", "server"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LORDBABUINO <lordbabuino@protonmail.com>"]
license = "MIT"
rust-version = "1.93.1"

[workspace.dependencies]
bitcoin = { version = "0.32.0", default-features = false, features = ["std", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
thiserror = "2.0.17"
stealth-engine = { git = "https://github.com/stealth-bitcoin/stealth", rev = "74fbacd3b348a3c968deabfe9dfe11b8592bf44a" }
stealth-model = { git = "https://github.com/stealth-bitcoin/stealth", rev = "74fbacd3b348a3c968deabfe9dfe11b8592bf44a" }
dever-core = { path = "core" }
axum = { version = "0.8.6", features = ["ws"] }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
tower-http = { version = "0.6.6", features = ["fs", "cors"] }
tower = { version = "0.5.2", features = ["util"] }
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
rand = "0.8.5"
http-body-util = "0.1.3"
